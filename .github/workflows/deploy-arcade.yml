name: Deploy Arcade

on:
  push:
    branches: [main]
    paths:
      - apps/arcade/**
      - packages/tokens/**
      - .github/workflows/deploy-arcade.yml

permissions:
  contents: read

concurrency:
  group: deploy-arcade
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # assets/kb-tokens.css is a committed copy of the shared tokens; stop if it has drifted.
      - run: pnpm turbo run lint --filter=@krishnabuilds/arcade
      - run: pnpm --filter @krishnabuilds/arcade exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
