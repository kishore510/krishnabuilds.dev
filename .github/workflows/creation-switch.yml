name: Room creation switch

# The Stickyard kill switch for starting new sessions. Run it from the Actions tab or the GitHub
# mobile app: Actions > Room creation switch > Run workflow > on/off.
# It sets the Worker secret CREATION_ENABLED ("true" or "false"). Secrets survive later
# deploys, so the setting sticks until this is run again. Existing sessions keep working.

on:
  workflow_dispatch:
    inputs:
      creation:
        description: "Allow starting new sessions?"
        type: choice
        options: ["off", "on"]
        default: "off"

permissions:
  contents: read

# Shares the deploy-stickyard group so it never races a Worker deploy.
concurrency:
  group: deploy-stickyard
  cancel-in-progress: false

jobs:
  switch:
    name: Set CREATION_ENABLED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: wrangler secret put CREATION_ENABLED
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ inputs.creation == 'on' && 'true' || 'false' }}
        run: |
          printf '%s' "$VALUE" | pnpm --filter @stickyard/worker exec wrangler secret put CREATION_ENABLED > /dev/null
          echo "Room creation is now ${{ inputs.creation }}."
