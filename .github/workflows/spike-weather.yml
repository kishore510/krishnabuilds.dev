# THROWAWAY SPIKE: allotment weather data. Lives only on spike/weather-fetch.
# Manual trigger, plus a push trigger limited to this branch and these files
# (owner-approved: workflow_dispatch alone only works once the file is on main). No secrets, no deploy, stores nothing.
name: spike-weather

on:
  workflow_dispatch:
  push:
    branches: [spike/weather-fetch]
    paths:
      - scripts/spike-weather/**
      - .github/workflows/spike-weather.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch forecast and historical weather
        run: python3 scripts/spike-weather/fetch.py
