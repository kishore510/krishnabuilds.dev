name: Deploy Sumyard

on:
  push:
    branches: [main]
    paths:
      - apps/sumyard/**
      - packages/tokens/**
      - packages/config/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-sumyard.yml

permissions:
  contents: read

concurrency:
  group: deploy-sumyard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test build --filter=@krishnabuilds/sumyard
      - run: pnpm --filter @krishnabuilds/sumyard exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
