    <title>Stickyard · krishnabuilds</title>
    <script>
      // Apply the theme before first paint to avoid a flash. The shared kb-theme cookie (packages/ui/src/theme.ts) wins;
      // until src/shell/theme.ts has moved an older local choice into it, that applies (mirrors migrateLocalTheme).
      (function () {
        var pref = "system";
        var shared = document.cookie.match(/(?:^|; )kb-theme=(light|dark)(?:;|$)/);
        if (shared) pref = shared[1];
        else try {
          pref = localStorage.getItem("stickyard:theme") || "system";
        } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
