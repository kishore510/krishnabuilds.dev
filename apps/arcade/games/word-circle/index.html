<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Circle</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  body {
    box-sizing: border-box;
    padding-top: var(--kb-navbar-h, 0px);
    padding-bottom: var(--kb-bottom-reserve, 0px);
  }
  #wrap { position: relative; }
  canvas#game {
    background: #2B1F3D;
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #F4EDE2;
    pointer-events: none;
  }
  .overlay.hidden { display: none; }

  /* ---------- difficulty select ---------- */
  #selectOverlay {
    background: linear-gradient(180deg, #2B1F3D, #1E1530);
    border-radius: 14px;
    pointer-events: auto;
  }
  #selectOverlay h1 {
    margin: 0 0 4px;
    font-size: calc(30px * var(--game-scale, 1));
    color: #F4EDE2;
  }
  #selectOverlay .tagline {
    margin: 0 0 calc(18px * var(--game-scale, 1));
    font-size: calc(13px * var(--game-scale, 1));
    color: rgba(244,237,226,0.55);
  }
  .diffList {
    display: flex;
    flex-direction: column;
    gap: calc(10px * var(--game-scale, 1));
    width: calc(220px * var(--game-scale, 1));
  }
  .diffBtn {
    font-family: inherit;
    font-size: calc(16px * var(--game-scale, 1));
    font-weight: 700;
    padding: calc(12px * var(--game-scale, 1)) calc(18px * var(--game-scale, 1));
    border-radius: calc(12px * var(--game-scale, 1));
    border: calc(1.5px * var(--game-scale, 1)) solid rgba(232,162,74,0.55);
    background: rgba(232,162,74,0.1);
    color: #F4EDE2;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .diffBtn:active { background: rgba(232,162,74,0.22); }
  .diffBtn .bestTime {
    font-size: calc(12px * var(--game-scale, 1));
    font-weight: 600;
    color: #E8A24A;
  }
  #backToArcade {
    display: inline-block;
    margin-top: calc(18px * var(--game-scale, 1));
    font-size: calc(13px * var(--game-scale, 1));
    font-weight: 700;
    color: #F4EDE2;
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity: 0.8;
    pointer-events: auto;
  }
  #backToArcade:active { opacity: 1; }

  /* ---------- mute button ---------- */
  #muteBtn {
    display: none;
    position: absolute;
    top: calc(8px * var(--game-scale, 1));
    left: 50%;
    transform: translateX(-50%);
    width: calc(28px * var(--game-scale, 1));
    height: calc(28px * var(--game-scale, 1));
    font-size: calc(13px * var(--game-scale, 1));
    border-radius: 50%;
    border: calc(1.5px * var(--game-scale, 1)) solid rgba(232,162,74,0.5);
    background: #2B1F3D;
    color: #F4EDE2;
    cursor: pointer;
    pointer-events: auto;
    z-index: 5;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  #muteBtn.visible { display: flex; }
  #muteBtn:active { background: #1E1530; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="360" height="540"></canvas>
  <button id="muteBtn" type="button">&#128266;</button>

  <div id="selectOverlay" class="overlay">
    <h1>Word Circle</h1>
    <p class="tagline">Swipe the circle, spell every word.</p>
    <div class="diffList">
      <button class="diffBtn" type="button" data-diff="easy">Easy <span class="bestTime" id="bestEasy">—</span></button>
      <button class="diffBtn" type="button" data-diff="medium">Medium <span class="bestTime" id="bestMedium">—</span></button>
      <button class="diffBtn" type="button" data-diff="hard">Hard <span class="bestTime" id="bestHard">—</span></button>
    </div>
    <a id="backToArcade" href="../../index.html">&larr; Back to Arcade</a>
  </div>
  <button id="playPing" type="button" data-kb-play style="display:none;"></button>
</div>

const CX = 180, CY = 148, RADIUS = 78, TILE_R = 24, TILE_HIT_R = 30;

function tilePos(i, n) {
  const angle = -Math.PI / 2 + (i / n) * Math.PI * 2;
  return [CX + Math.cos(angle) * RADIUS, CY + Math.sin(angle) * RADIUS];
}

function roundRect(x, y, w, h, r) {

  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function fitCanvas() {
  const reserved = (window.kbNavbarHeight || 0) + (window.kbBottomReserve || 0);
  const availH = window.innerHeight - reserved;
  const scale = Math.min(window.innerWidth / LOGICAL_W, availH / LOGICAL_H);
  const dpr = window.devicePixelRatio || 1;
  const cssW = LOGICAL_W * scale, cssH = LOGICAL_H * scale;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(scale * dpr, scale * dpr);
  wrap.style.setProperty('--game-scale', scale);
  draw();
}

let audioCtx = null;

function ensureAudio() {

    audioCtx = new AC();

}
function playTone(freq, dur, delay, type, peak) {

  if (!ac) return;
  const t0 = ac.currentTime + delay;

  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  gain.connect(ac.destination);

  osc.stop(t0 + dur + 0.02);

function playTick() { playTone(680, 0.03, 0, 'sine', 0.045); }

function playLossTone() { playTone(300, 0.18, 0, 'sine', 0.08); playTone(220, 0.35, 0.12, 'sine', 0.07); }
function updateMuteBtn() { muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;'; }

function bestKey(diffKey) { return 'wordcircle_best_' + diffKey; }
function getBest(diffKey) {

  return v ? parseInt(v, 10) : null;
}
function setBestIfBetter(diffKey, ms) {

  if (prev === null || ms < prev) { sessionStorage.setItem(bestKey(diffKey), String(ms)); return true; }
  return false;
}
function formatTime(ms) {

  document.getElementById('bestMedium').textContent = getBest('medium') !== null ? formatTime(getBest('medium')) : '—';

// ============================================================
// Game state
// ============================================================
let screen = 'select'; // 'select' | 'playing' | 'won' | 'lost'
let difficulty = 'easy';
let anchor = '';
let circleLetters = [];
let required = [];
let bonus = [];
let foundRequired = new Set();
let foundRequiredOrder = [];
let foundBonusSet = new Set();
const foundAnimAt = new Map(); // word -> timestamp, drives blank fill-in pop

let selectionOrder = []; // indices into circleLetters, in pick order
let usedTiles = new Set();
let pointerActive = false;
let dragMoved = false;
let dragPos = null; // live logical pointer pos while dragging, for the live connector line
let invalidShakeAt = 0;

let timerStarted = false;
let startTime = 0;
let winElapsed = 0;

const MAX_HINTS = 3;
let hintsUsed = 0;
let hintedLetters = new Map(); // word -> Set of revealed letter indices
let revealedWords = new Set(); // words shown via Give Up (loss only)
let hintToast = null; // { text, at } - transient clue banner
let HINT_PILL_RECT = null;

let resultAnim = null; // { t0, dismissed, kind: 'won'|'lost' } drives the result panel's scale-in pop
const RESULT_ANIM_DUR = 380;
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
const RESULT_BUTTONS = {};

function newGame(diffKey) {
  playPingBtn.click();
  difficulty = diffKey;
  const n = DIFFS[diffKey].n;
  const bank = WORD_CIRCLE_PUZZLES[n];
  const keys = Object.keys(bank);
  anchor = keys[Math.floor(Math.random() * keys.length)];
  const data = bank[anchor];
  required = data.required.slice();
  bonus = data.bonus.slice();
  circleLetters = shuffle(anchor.split(''), Math.random);

  foundRequired = new Set();
  foundRequiredOrder = [];
  foundBonusSet = new Set();
  foundAnimAt.clear();

  selectionOrder = [];
  usedTiles = new Set();
  pointerActive = false;
  dragMoved = false;
  dragPos = null;
  invalidShakeAt = 0;

  timerStarted = false;
  startTime = 0;
  resultAnim = null;

  hintsUsed = 0;
  hintedLetters = new Map();
  revealedWords = new Set();
  hintToast = null;

  screen = 'playing';
  showScreen();
}

function startTimer() { timerStarted = true; startTime = performance.now(); }
function getElapsedMs(now) { return timerStarted ? now - startTime : 0; }

function clearSelection() {
  selectionOrder = [];
  usedTiles = new Set();
}

function finalizeSelection() {
  if (selectionOrder.length === 0) return;
  const word = selectionOrder.map(i => circleLetters[i]).join('');
  if (required.includes(word) && !foundRequired.has(word)) {
    foundRequired.add(word);
    foundRequiredOrder.push(word);
    foundAnimAt.set(word, performance.now());
    playFound(foundRequiredOrder.length);
    clearSelection();
    checkWin();
  } else if (bonus.includes(word) && !foundBonusSet.has(word)) {
    foundBonusSet.add(word);
    playBonus();
    clearSelection();
  } else {
    invalidShakeAt = performance.now();
    playInvalid();
    clearSelection();
  }
}

function checkWin() {
  if (required.length > 0 && foundRequired.size === required.length) win();
}

function win() {
  const now = performance.now();
  winElapsed = getElapsedMs(now);
  screen = 'won';
  setBestIfBetter(difficulty, Math.round(winElapsed));
  resultAnim = { t0: now, dismissed: false, kind: 'won' };
  playWinFanfare();
}

// Picks the unfound required word closest to completion (fewest hidden
// letters left), so 3 hints concentrate on finishing one word rather than
// sprinkling single letters across many - min word length is 4, so hints
// alone can never fully spell a word out; the player always has to
// actually swipe it.
function useHint() {
  if (screen !== 'playing') return;
  if (hintsUsed >= MAX_HINTS) { giveUp(); return; }
  const candidates = required.filter(w => !foundRequired.has(w));
  if (candidates.length === 0) return;
  candidates.sort((a, b) => {
    const aHidden = a.length - (hintedLetters.get(a) ? hintedLetters.get(a).size : 0);
    const bHidden = b.length - (hintedLetters.get(b) ? hintedLetters.get(b).size : 0);
    if (aHidden !== bHidden) return aHidden - bHidden;
    if (a.length !== b.length) return a.length - b.length;
    return 0;
  });
  const target = candidates[0];
  let set = hintedLetters.get(target);
  if (!set) { set = new Set(); hintedLetters.set(target, set); }
  let idx = -1;
  for (let i = 0; i < target.length; i++) { if (!set.has(i)) { idx = i; break; } }
  if (idx === -1) return;
  set.add(idx);
  hintsUsed++;
  hintToast = { text: HINT_CLUES[target] || 'a puzzle word', at: performance.now() };
  playHintChime();
}

function giveUp() {
  if (screen !== 'playing') return;
  for (const w of required) { if (!foundRequired.has(w)) revealedWords.add(w); }
  clearSelection();
  screen = 'lost';
  resultAnim = { t0: performance.now(), dismissed: false, kind: 'lost' };
  playLossTone();
}

// ============================================================
// Input
// ============================================================
function getLogicalPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (LOGICAL_W / rect.width),
    y: (clientY - rect.top) * (LOGICAL_H / rect.height),
  };
}
function tileAt(x, y) {
  for (let i = 0; i < circleLetters.length; i++) {
    const [tx, ty] = tilePos(i, circleLetters.length);
    if (Math.hypot(x - tx, y - ty) <= TILE_HIT_R) return i;
  }
  return -1;
}
function hitTest(rect, x, y) {
  return rect && x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}

canvas.addEventListener('pointerdown', (e) => {
  const pos = getLogicalPos(e.clientX, e.clientY);

  if (screen === 'won' || screen === 'lost') {
    if (resultAnim && resultAnim.dismissed) {
      if (hitTest(RESULT_BUTTONS.reopen, pos.x, pos.y)) { resultAnim.dismissed = false; resultAnim.t0 = performance.now(); }
      return;
    }
    if (!resultAnim) return;
    if (hitTest(RESULT_BUTTONS.playAgain, pos.x, pos.y)) { ensureAudio(); newGame(difficulty); }
    else if (hitTest(RESULT_BUTTONS.viewBoard, pos.x, pos.y)) { resultAnim.dismissed = true; }
    else if (hitTest(RESULT_BUTTONS.changeDiff, pos.x, pos.y)) { screen = 'select'; showScreen(); }
    return;
  }
  if (screen !== 'playing') return;
  ensureAudio();

  if (hitTest(HINT_PILL_RECT, pos.x, pos.y)) { useHint(); return; }

  const idx = tileAt(pos.x, pos.y);
  if (idx === -1) {
    // background tap: finalize whatever is currently selected
    finalizeSelection();
    return;
  }

  if (!timerStarted) startTimer();

  if (selectionOrder.length > 0 && selectionOrder[selectionOrder.length - 1] === idx) {
    // tap on last-selected tile again: backtrack
    selectionOrder.pop();
    usedTiles.delete(idx);
    return;
  }
  if (usedTiles.has(idx)) return; // already used earlier in this selection, ignore

  selectionOrder.push(idx);
  usedTiles.add(idx);
  playTick();
  canvas.setPointerCapture(e.pointerId);
  pointerActive = true;
  dragMoved = false;
  dragPos = pos;
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointerActive) return;
  const pos = getLogicalPos(e.clientX, e.clientY);
  dragPos = pos;
  const idx = tileAt(pos.x, pos.y);
  if (idx !== -1 && !usedTiles.has(idx)) {
    selectionOrder.push(idx);
    usedTiles.add(idx);
    playTick();
    dragMoved = true;
  }
});
canvas.addEventListener('pointerup', () => {
  if (!pointerActive) return;
  pointerActive = false;
  if (dragMoved) finalizeSelection();
  dragMoved = false;
  dragPos = null;
});
canvas.addEventListener('pointercancel', () => {
  pointerActive = false;
  dragMoved = false;
  dragPos = null;
  clearSelection();
});

// Screen wiring

function showScreen() {
  selectOverlay.classList.toggle('hidden', screen !== 'select');
  muteBtn.classList.toggle('visible', screen !== 'select');

}

document.querySelectorAll('.diffBtn').forEach(btn => {

screen = 'select';

// Drawing
// ============================================================
let bgGradCache = null, glowGradCache = null, vigGradCache = null;
function cachedBackgroundGradients() {
  if (!bgGradCache) {
    bgGradCache = ctx.createLinearGradient(0, 0, 0, LOGICAL_H);
    bgGradCache.addColorStop(0, PAL.bg);
    bgGradCache.addColorStop(1, PAL.bgLow);
  }
  if (!glowGradCache) {
    glowGradCache = ctx.createRadialGradient(CX, CY, 20, CX, CY, 220);
    glowGradCache.addColorStop(0, 'rgba(232,162,74,0.16)');
    glowGradCache.addColorStop(0.5, 'rgba(232,162,74,0.05)');
    glowGradCache.addColorStop(1, 'rgba(232,162,74,0)');
  }
  if (!vigGradCache) {
    vigGradCache = ctx.createRadialGradient(180, 270, 200, 180, 270, 420);
    vigGradCache.addColorStop(0, 'rgba(0,0,0,0)');
    vigGradCache.addColorStop(1, 'rgba(0,0,0,0.28)');
  }
  return [bgGradCache, glowGradCache, vigGradCache];
}
let sparklePts = null;
function sparklePoints() {
  if (sparklePts) return sparklePts;
  sparklePts = [];
  let seed = 7;
  function rand() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return (seed % 1000) / 1000; }
  for (let i = 0; i < 40; i++) {
    sparklePts.push({ x: rand() * LOGICAL_W, y: rand() * LOGICAL_H, r: rand() * 1.1 + 0.3, a: 0.15 + rand() * 0.25 });
  }

function drawBackground() {

  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = glowGrad;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  for (const p of sparklePoints()) {
    ctx.globalAlpha = p.a;
    ctx.fillStyle = '#F4EDE2';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
}

function drawHUD() {
  ctx.textBaseline = 'middle';
  ctx.fillStyle = PAL.hudSub;
  ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(DIFFS[difficulty].label, 16, 16);

  const label = '✨ Bonus: ' + foundBonusSet.size + '/' + bonus.length;
  ctx.font = '600 11px -apple-system, sans-serif';

}

function drawHintPill() {
  const hasHints = hintsUsed < MAX_HINTS;
  const label = hasHints ? ('💡 Hint (' + (MAX_HINTS - hintsUsed) + ')') : '🏳 Give Up';
  ctx.font = '600 11px -apple-system, sans-serif';

  ctx.stroke();

  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

}

function drawHintToast(now) {
  if (!hintToast) return;
  const DURATION = 3800, FADE = 700;
  const age = now - hintToast.at;
  if (age > DURATION) { hintToast = null; return; }
  const alpha = age > DURATION - FADE ? 1 - (age - (DURATION - FADE)) / FADE : 1;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '600 11px -apple-system, sans-serif';
  const maxW = 300;
  const words = ('Hint: ' + hintToast.text).split(' ');
  const lines = [];
  let cur = '';
  for (const word of words) {
    const test = cur ? cur + ' ' + word : word;
    if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = word; }
    else cur = test;
  }
  if (cur) lines.push(cur);

  const lineH = 15;
  const panelW = maxW + 24, panelH = lines.length * lineH + 16;
  const px = (LOGICAL_W - panelW) / 2, py = 42;
  roundRect(px, py, panelW, panelH, 10);
  ctx.fillStyle = 'rgba(20,14,32,0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(232,162,74,0.5)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = '#F4EDE2';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((line, i) => ctx.fillText(line, LOGICAL_W / 2, py + 8 + i * lineH + lineH / 2));

function shakeOffset(now) {

function drawCircleArea(now) {
  ctx.beginPath();
  ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(232,162,74,0.15)';
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
  ctx.strokeStyle = PAL.ringTrack;
  ctx.lineWidth = 1.5;

  const shake = shakeOffset(now);

  if (selectionOrder.length > 0) {
    ctx.save();
    ctx.translate(shake, 0);
    ctx.shadowColor = 'rgba(232,162,74,0.7)';
    ctx.shadowBlur = 14;

    selectionOrder.forEach((idx, i) => {
      const [x, y] = tilePos(idx, circleLetters.length);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    if (pointerActive && dragMoved && dragPos) ctx.lineTo(dragPos.x, dragPos.y);
    ctx.strokeStyle = PAL.swipeLine;
    ctx.lineWidth = 6;

    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.restore();

  const previewText = selectionOrder.map(i => circleLetters[i]).join('');
  if (previewText) {

    ctx.shadowColor = 'rgba(244,237,226,0.5)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = PAL.centerPreview;
    const fontSize = previewText.length > 6 ? 18 : 24;
    ctx.font = 'bold ' + fontSize + 'px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(previewText, CX, CY);
    ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  circleLetters.forEach((letter, i) => {
    const [x, y] = tilePos(i, circleLetters.length);
    const isSelected = usedTiles.has(i);

    ctx.save();
    ctx.shadowColor = isSelected ? 'rgba(232,162,74,0.55)' : 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = isSelected ? 16 : 8;
    ctx.shadowOffsetY = isSelected ? 0 : 3;
    ctx.beginPath();

      grad.addColorStop(0, '#F0B968');
      grad.addColorStop(1, '#DB8F2E');
    } else {
      grad.addColorStop(0, '#FFFBF4');
      grad.addColorStop(1, '#E8DFD0');
    }
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(x, y, TILE_R, 0, Math.PI * 2);
    ctx.strokeStyle = isSelected ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = isSelected ? PAL.tileSelectedText : PAL.tileText;
    ctx.font = 'bold 20px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(letter, x, y + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  });
}

function drawWordBlanks(now) {
  const byLength = {};
  for (const w of required) (byLength[w.length] = byLength[w.length] || []).push(w);
  const lengths = Object.keys(byLength).map(Number).sort((a, b) => a - b);

  let y = CY + RADIUS + 40;
  const boxSize = 22, boxGap = 3, rowGap = 10, groupGap = 14;

  for (const len of lengths) {

    let x = 20;
    const rowWidth = len * (boxSize + boxGap) - boxGap;
    for (const word of words) {
      if (x + rowWidth > 340) { x = 20; y += boxSize + rowGap; }
      const found = foundRequired.has(word);
      const revealed = revealedWords.has(word);
      const hintSet = hintedLetters.get(word);
      const animAt = foundAnimAt.get(word) || 0;
      const t = animAt ? Math.min(1, (now - animAt) / 220) : 1;
      for (let i = 0; i < word.length; i++) {

          ctx.globalAlpha = t;
          const ty = y + (1 - t) * 6;
          ctx.shadowColor = 'rgba(111,191,139,0.45)';
          ctx.shadowBlur = 6;
          ctx.shadowOffsetY = 2;
          roundRect(bx, ty, boxSize, boxSize, 5);
          const g = ctx.createLinearGradient(bx, ty, bx, ty + boxSize);
          g.addColorStop(0, '#7FCB99');
          g.addColorStop(1, '#5CAE79');
          ctx.fillStyle = g;
          ctx.fill();
          ctx.restore();
          ctx.save();
          ctx.globalAlpha = t;
          ctx.fillStyle = '#132018';
          ctx.font = 'bold 13px -apple-system, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(word[i], bx + boxSize / 2, y + (1 - t) * 6 + boxSize / 2 + 1);
          ctx.restore();
          ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        } else if (revealed) {
          roundRect(bx, y, boxSize, boxSize, 5);
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(244,237,226,0.28)';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = 'rgba(244,237,226,0.75)';
          ctx.font = 'bold 13px -apple-system, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(word[i], bx + boxSize / 2, y + boxSize / 2 + 1);
          ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        } else if (hintSet && hintSet.has(i)) {
          roundRect(bx, y, boxSize, boxSize, 5);
          ctx.fillStyle = 'rgba(232,162,74,0.16)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(232,162,74,0.55)';
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = '#E8A24A';
          ctx.font = 'bold 13px -apple-system, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(word[i], bx + boxSize / 2, y + boxSize / 2 + 1);
          ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        } else {
          roundRect(bx, y, boxSize, boxSize, 5);
          ctx.fillStyle = 'rgba(255,255,255,0.05)';
          ctx.fill();
          ctx.strokeStyle = PAL.blankEmpty;
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }
      }
      x += rowWidth + 14;
    }
    y += boxSize + groupGap;
  }
}

const RESULT_PANEL_W = 280, RESULT_PANEL_H = 300;
// Result panel covers the word blanks, so both win and loss support the
// same dismiss/reopen pattern Lexigrid uses for its result overlay - a
// "View Board" tap hides the panel to reveal the (found or given-up)
// board underneath, and a small reopen tag brings it back.
function drawResultOverlay(now) {
  if (!resultAnim || resultAnim.dismissed) return;
  const age = now - resultAnim.t0;
  const t = Math.min(1, age / RESULT_ANIM_DUR);
  const scale = 0.85 + easeOutBack(t) * 0.15;
  const won = resultAnim.kind === 'won';

  ctx.fillStyle = 'rgba(10,7,16,0.75)';
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  const cx = LOGICAL_W / 2, cy = LOGICAL_H / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);

  const px = cx - RESULT_PANEL_W / 2, py = cy - RESULT_PANEL_H / 2;
  roundRect(px, py, RESULT_PANEL_W, RESULT_PANEL_H, 18);
  ctx.fillStyle = 'rgba(43,31,64,0.97)';
  ctx.fill();
  ctx.strokeStyle = won ? 'rgba(232,162,74,0.5)' : 'rgba(244,237,226,0.3)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  let y = py + 40;
  ctx.font = '800 24px -apple-system, sans-serif';
  ctx.fillStyle = PAL.hudText;
  ctx.fillText(won ? 'Solved!' : 'Out of Hints', cx, y);

  y += 34;
  ctx.font = '700 16px -apple-system, sans-serif';
  if (won) {
    ctx.fillStyle = PAL.bonusText;
    ctx.fillText('Time: ' + formatTime(winElapsed), cx, y);
  } else {
    ctx.fillStyle = PAL.hudText;
    ctx.fillText(foundRequired.size + ' of ' + required.length + ' words found', cx, y);
  }

  y += 24;
  ctx.font = '600 12px -apple-system, sans-serif';
  ctx.fillStyle = PAL.hudSub;
  if (won) {
    const best = getBest(difficulty);
    ctx.fillText(best === Math.round(winElapsed) ? 'New best time!' : ('Best: ' + formatTime(best)), cx, y);
  } else {
    ctx.fillText('The missed words are revealed below', cx, y);
  }

  y += 24;
  ctx.font = '600 13px -apple-system, sans-serif';
  ctx.fillStyle = PAL.bonusText;
  ctx.fillText('✨ ' + foundBonusSet.size + ' bonus word' + (foundBonusSet.size === 1 ? '' : 's') + ' found', cx, y);

  y += 34;
  const btnW = 160, btnH = 34;
  function drawResultBtn(label, yCenter, primary) {
    const bx = cx - btnW / 2, by = yCenter - btnH / 2;
    roundRect(bx, by, btnW, btnH, 17);
    if (primary) {
      ctx.fillStyle = '#E8A24A';
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(244,237,226,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.font = '700 13px -apple-system, sans-serif';
    ctx.fillStyle = primary ? '#2B1F3D' : PAL.hudText;
    ctx.fillText(label, cx, by + btnH / 2 + 1);
    return pxRectToLogical(px, py, scale, cx, cy, bx, by, btnW, btnH);
  }
  RESULT_BUTTONS.playAgain = drawResultBtn('Play Again', y, true);
  y += 44;
  RESULT_BUTTONS.viewBoard = drawResultBtn('View Board', y, false);
  y += 44;
  RESULT_BUTTONS.changeDiff = drawResultBtn('Change Difficulty', y, false);

  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function drawResultReopenTag() {
  if (!(resultAnim && resultAnim.dismissed)) { RESULT_BUTTONS.reopen = null; return; }
  const w = 84, h = 22, x = 344 - w, y = 40;
  roundRect(x, y, w, h, 11);
  ctx.fillStyle = 'rgba(20,14,32,0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(232,162,74,0.5)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.font = '700 11px -apple-system, sans-serif';
  ctx.fillStyle = '#F4EDE2';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('▲ Result', x + w / 2, y + h / 2 + 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  RESULT_BUTTONS.reopen = { x, y, w, h };
}
// Buttons are drawn inside a scaled/translated context (the pop-in
// animation); convert their rect back to un-scaled logical canvas
// coordinates so pointer hit-testing (which reads raw logical coords)
// lines up once the panel has settled at scale 1.
function pxRectToLogical(px, py, scale, cx, cy, x, y, w, h) {
  const lx = cx + (x - cx) * scale;
  const ly = cy + (y - cy) * scale;
  return { x: lx, y: ly, w: w * scale, h: h * scale };
}

function draw() {
  const now = performance.now();
  drawBackground();
  if (screen === 'playing' || screen === 'won' || screen === 'lost') {
    drawHUD();
    if (screen === 'playing') drawHintPill();
    drawCircleArea(now);
    drawWordBlanks(now);
    if (screen === 'playing') drawHintToast(now);
  }
  if (screen === 'won' || screen === 'lost') {
    drawResultOverlay(now);
    drawResultReopenTag();
  }
}

function loop() {
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
// Boot
// ============================================================
fitCanvas();
showScreen();
requestAnimationFrame(loop);
})();
</script>
