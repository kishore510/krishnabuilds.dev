<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slice Master</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a0f08;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  body {
    box-sizing: border-box;
    padding-top: var(--kb-navbar-h, 0px);
    padding-bottom: var(--kb-bottom-reserve, 0px);
  }
  #wrap { position: relative; }
  canvas {
    background: #1a0f08;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
    box-sizing: border-box;
  }
  #overlayCard {
    background: rgba(10, 6, 4, 0.6);
    border: calc(1.5px * var(--game-scale, 1)) solid rgba(255,255,255,0.18);
    border-radius: calc(18px * var(--game-scale, 1));
    padding: calc(20px * var(--game-scale, 1)) calc(22px * var(--game-scale, 1));
    backdrop-filter: blur(3px);
  }
  #overlay h1 { margin: 0 0 8px; font-size: calc(30px * var(--game-scale, 1)); }
  #overlay p { margin: 4px 0; font-size: calc(15px * var(--game-scale, 1)); opacity: 0.9; }
  #scoreLine { line-height: 1.5; }
  #diffButtons {
    display: flex;
    gap: calc(14px * var(--game-scale, 1));
    margin-top: calc(18px * var(--game-scale, 1));
    pointer-events: auto;
  }
  #diffButtons button {
    font-family: inherit;
    font-size: calc(15px * var(--game-scale, 1));
    font-weight: bold;
    padding: calc(10px * var(--game-scale, 1)) calc(22px * var(--game-scale, 1));
    border-radius: calc(24px * var(--game-scale, 1));
    border: calc(2px * var(--game-scale, 1)) solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.12);
    color: white;
    cursor: pointer;
  }
  #diffButtons button:active {
    background: rgba(255,255,255,0.3);
  }
  #diffButtons button.selected {
    background: #ffb703;
    border-color: #ffb703;
    color: #1a0f08;
  }
  #backToArcade {
    display: none;
    margin-top: calc(18px * var(--game-scale, 1));
    font-size: calc(14px * var(--game-scale, 1));
    font-weight: bold;
    color: white;
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity: 0.85;
    pointer-events: auto;
  }
  #backToArcade:active { opacity: 1; }
  #muteBtn {
    position: absolute;
    top: calc(8px * var(--game-scale, 1));
    left: 50%;
    transform: translateX(-50%);
    font-size: calc(13px * var(--game-scale, 1));
    padding: calc(4px * var(--game-scale, 1)) calc(10px * var(--game-scale, 1));
    border-radius: calc(14px * var(--game-scale, 1));
    border: calc(1.5px * var(--game-scale, 1)) solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.35);
    color: white;
    cursor: pointer;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="360" height="540"></canvas>
  <button id="muteBtn" type="button">🔊</button>
  <div id="overlay">
    <div id="overlayCard">
      <h1 id="title">Slice Master</h1>
      <p id="subtitle">Tap to keep the knife airborne and slice everything in sight. Touch the board and you're done.</p>
      <p id="scoreLine" style="display:none;"></p>
      <div id="diffButtons">
        <button id="easyBtn" type="button" data-kb-play>Easy</button>
        <button id="hardBtn" type="button" data-kb-play>Hard</button>
      </div>
      <a id="backToArcade" href="../../index.html">&larr; Back to Arcade</a>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const title = document.getElementById('title');
const subtitle = document.getElementById('subtitle');
const scoreLine = document.getElementById('scoreLine');
const easyBtn = document.getElementById('easyBtn');
const hardBtn = document.getElementById('hardBtn');
const diffButtons = document.getElementById('diffButtons');
const muteBtn = document.getElementById('muteBtn');
const backToArcade = document.getElementById('backToArcade');

const W = canvas.width, H = canvas.height;
const GROUND_H = 26;

function fitCanvas() {
  const reserved = (window.kbNavbarHeight || 0) + (window.kbBottomReserve || 0);
  const availH = window.innerHeight - reserved;
  const scale = Math.min(window.innerWidth / W, availH / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  document.getElementById('wrap').style.setProperty('--game-scale', scale);
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('kb-navbar-ready', fitCanvas);
fitCanvas();

// --- Flight physics: gravity pulls the knife down, tapping gives it a
// fixed upward kick. Only fruit spawn rate/speed ramp with time and
// difficulty; gravity/kick stay constant so the controls never get
// harder to predict, only the traffic does. ---
const GRAVITY = 0.30;
const FLAP = -6.6;
const FALL_CAP = 10.5;
const KNIFE_X = 105;
const KNIFE_R = 15;

const DIFFICULTY_PRESETS = {
  easy: { baseSpeed: 2.0, capSpeed: 3.2, baseInterval: 76, capInterval: 50, towerSpeed: 3.0 },
  hard: { baseSpeed: 3.0, capSpeed: 4.6, baseInterval: 54, capInterval: 34, towerSpeed: 4.6 }
};
const RAMP_DURATION = 1800; // frames (~30s) to reach the hard-capped ramp ceiling

let difficulty = 'easy';
let preset = DIFFICULTY_PRESETS.easy;

// --- Audio: generated on the fly with the Web Audio API, no files ---
let audioCtx = null;
let muted = sessionStorage.getItem('sliceMasterMuted') === '1';

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, duration, type, volume, delay) {
  if (muted) return;
  ensureAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.value = volume || 0.12;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const startTime = audioCtx.currentTime + (delay || 0);
  osc.start(startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.stop(startTime + duration + 0.03);
}

function playFlap() { tone(440, 0.06, 'square', 0.06); }
function playSlice() { tone(1300, 0.07, 'triangle', 0.11); tone(1800, 0.05, 'triangle', 0.07, 0.03); }
function playGroundHit() { tone(140, 0.4, 'sawtooth', 0.16); }
function playLockThunk() { tone(200, 0.12, 'square', 0.14); }
function playGood() { tone(660, 0.1, 'triangle', 0.13); tone(880, 0.12, 'triangle', 0.11, 0.08); }
function playJackpot() {
  tone(660, 0.09, 'triangle', 0.14); tone(880, 0.09, 'triangle', 0.13, 0.09);
  tone(1100, 0.09, 'triangle', 0.13, 0.18); tone(1320, 0.16, 'triangle', 0.14, 0.27);
}
function playBad() { tone(420, 0.18, 'sawtooth', 0.12); tone(260, 0.28, 'sawtooth', 0.13, 0.14); }

function updateMuteBtn() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
updateMuteBtn();
muteBtn.addEventListener('click', () => {
  muted = !muted;
  sessionStorage.setItem('sliceMasterMuted', muted ? '1' : '0');
  updateMuteBtn();
});

// --- Tower: 8 blocks shuffled each round from a fixed pool so the mix of
// multipliers/penalty stays the same on average, only the layout changes ---
const BLOCK_POOL = [
  { label: '2x', mult: 2, color: '#3a86ff' },
  { label: '2x', mult: 2, color: '#3a86ff' },
  { label: '2x', mult: 2, color: '#3a86ff' },
  { label: '3x', mult: 3, color: '#2ec4b6' },
  { label: '3x', mult: 3, color: '#2ec4b6' },
  { label: '1/2', mult: 0.5, color: '#6b2737' },
  { label: '1/2', mult: 0.5, color: '#6b2737' },
  { label: '5x', mult: 5, color: '#8338ec' },
  { label: '10x', mult: 10, color: '#ffbe0b' }
];
const TOWER_TOP = 78;
const TOWER_BOTTOM = H - 46;
const TOWER_W = 150;
const TOWER_X = W / 2 - TOWER_W / 2;

function buildTowerBlocks() {
  const blocks = BLOCK_POOL.slice();
  for (let i = blocks.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
  }
  return blocks;
}

const FRUITS = ['🍎', '🍊', '🍋', '🍉', '🍇', '🍌', '🥝', '🍒', '🧀'];

let knife, fruits, particles, frame, sliceCount, best, state;
let towerBlocks, towerPointerY, towerDir, blockH, selectedIndex;
let lockFrame, knifeStart, knifeTarget, finalScore;

function loadBest(diff) { return parseInt(sessionStorage.getItem('sliceMasterBest_' + diff) || '0', 10); }
function saveBest(diff, v) { try { sessionStorage.setItem('sliceMasterBest_' + diff, v); } catch (e) {} }

function reset() {
  knife = { x: KNIFE_X, y: H / 2, vy: 0, rot: 0 };
  fruits = [];
  particles = [];
  frame = 0;
  sliceCount = 0;
  state = 'ready';
  title.textContent = 'Slice Master';
  subtitle.textContent = "Tap to keep the knife airborne and slice everything in sight. Touch the board and you're done.";
  scoreLine.style.display = 'none';
  diffButtons.style.display = 'flex';
  backToArcade.style.display = 'none';
  best = loadBest(difficulty);
  updateDiffButtonStyles();
  overlay.style.display = 'flex';
}

function updateDiffButtonStyles() {
  easyBtn.classList.toggle('selected', difficulty === 'easy');
  hardBtn.classList.toggle('selected', difficulty === 'hard');
}

function startGame(diff) {
  difficulty = diff;
  preset = DIFFICULTY_PRESETS[diff];
  best = loadBest(difficulty);
  knife = { x: KNIFE_X, y: H / 2, vy: 0, rot: 0 };
  fruits = [];
  particles = [];
  frame = 0;
  sliceCount = 0;
  state = 'flying';
  overlay.style.display = 'none';
  ensureAudio();
}

easyBtn.addEventListener('click', () => startGame('easy'));
hardBtn.addEventListener('click', () => startGame('hard'));

function handleTap() {
  if (state === 'flying') { knife.vy = FLAP; playFlap(); }
  else if (state === 'tower') { lockTower(); }
  else if (state === 'over') { reset(); }
}
canvas.addEventListener('mousedown', handleTap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); handleTap(); }
});

function spawnFruit() {
  fruits.push({
    x: W + 20,
    y: 40 + Math.random() * (H - GROUND_H - 80),
    r: 16,
    emoji: FRUITS[Math.floor(Math.random() * FRUITS.length)],
    sliced: false
  });
}

function spawnParticles(x, y) {
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 2.5;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 20, color: `hsl(${Math.floor(Math.random()*40)+ (Math.random()<0.5?0:100)}, 80%, 60%)` });
  }
}

function updateFlying() {
  frame++;

  knife.vy += GRAVITY;
  knife.vy = Math.max(-FALL_CAP, Math.min(FALL_CAP, knife.vy));
  knife.y += knife.vy;
  knife.y = Math.max(KNIFE_R, knife.y);
  knife.rot += 0.12 + Math.abs(knife.vy) * 0.01;

  const ramp = Math.min(1, frame / RAMP_DURATION);
  const speed = preset.baseSpeed + (preset.capSpeed - preset.baseSpeed) * ramp;
  const interval = Math.round(preset.baseInterval - (preset.baseInterval - preset.capInterval) * ramp);

  if (frame % interval === 0) spawnFruit();

  for (const f of fruits) {
    f.x -= speed;
    if (!f.sliced) {
      const dx = f.x - knife.x, dy = f.y - knife.y;
      if (dx * dx + dy * dy < (f.r + KNIFE_R) * (f.r + KNIFE_R)) {
        f.sliced = true;
        sliceCount++;
        playSlice();
        spawnParticles(f.x, f.y);
      }
    }
  }
  fruits = fruits.filter(f => f.x > -30 && !f.sliced);

  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  particles = particles.filter(p => p.life > 0);

  if (knife.y + KNIFE_R > H - GROUND_H) {
    knife.y = H - GROUND_H - KNIFE_R;
    endFlight();
  }
}

function endFlight() {
  state = 'tower';
  playGroundHit();
  towerBlocks = buildTowerBlocks();
  blockH = (TOWER_BOTTOM - TOWER_TOP) / towerBlocks.length;
  towerPointerY = TOWER_TOP;
  towerDir = 1;
  knife.x = TOWER_X - 34;
  knife.y = towerPointerY;
  knife.rot = -Math.PI / 4;
}

function updateTower() {
  towerPointerY += towerDir * preset.towerSpeed;
  if (towerPointerY >= TOWER_BOTTOM) { towerPointerY = TOWER_BOTTOM; towerDir = -1; }
  if (towerPointerY <= TOWER_TOP) { towerPointerY = TOWER_TOP; towerDir = 1; }
  knife.y = towerPointerY;
}

function lockTower() {
  selectedIndex = Math.max(0, Math.min(towerBlocks.length - 1, Math.floor((towerPointerY - TOWER_TOP) / blockH)));
  state = 'locking';
  lockFrame = 0;
  knifeStart = { x: knife.x, y: knife.y };
  knifeTarget = { x: TOWER_X + TOWER_W / 2, y: TOWER_TOP + selectedIndex * blockH + blockH / 2 };
  playLockThunk();
}

function updateLocking() {
  lockFrame++;
  const t = Math.min(1, lockFrame / 16);
  knife.x = knifeStart.x + (knifeTarget.x - knifeStart.x) * t;
  knife.y = knifeStart.y + (knifeTarget.y - knifeStart.y) * t;
  knife.rot += 0.3;
  if (lockFrame === 16) spawnParticles(knifeTarget.x, knifeTarget.y);
  if (lockFrame >= 16 + 26) finalizeScore();
}

function finalizeScore() {
  const block = towerBlocks[selectedIndex];
  finalScore = Math.round(sliceCount * block.mult);
  if (block.mult < 1) playBad();
  else if (block.mult >= 5) playJackpot();
  else playGood();

  best = loadBest(difficulty);
  if (finalScore > best) { best = finalScore; saveBest(difficulty, best); }

  state = 'over';
  title.textContent = block.mult < 1 ? 'Ouch! Halved!' : (block.mult >= 5 ? 'Jackpot!' : 'Nice multiplier!');
  subtitle.textContent = 'Choose a mode to play again';
  scoreLine.style.display = 'block';
  scoreLine.innerHTML = 'Sliced: ' + sliceCount + ' × ' + block.label + ' = <strong>' + finalScore + '</strong><br>Best (' + (difficulty === 'easy' ? 'Easy' : 'Hard') + '): ' + best;
  diffButtons.style.display = 'flex';
  backToArcade.style.display = 'inline-block';
  updateDiffButtonStyles();
  overlay.style.display = 'flex';
}

function update() {
  if (state === 'flying') updateFlying();
  else if (state === 'tower') updateTower();
  else if (state === 'locking') updateLocking();
}

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  if (state === 'tower' || state === 'locking' || state === 'over') {
    grad.addColorStop(0, '#0d0715');
    grad.addColorStop(1, '#241030');
  } else {
    grad.addColorStop(0, '#fff3d6');
    grad.addColorStop(0.6, '#ffd97d');
    grad.addColorStop(1, '#f2a541');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawGround() {
  ctx.fillStyle = '#c98a4b';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.strokeStyle = '#a86b34';
  ctx.lineWidth = 2;
  for (let x = 6; x < W; x += 26) {
    ctx.beginPath();
    ctx.moveTo(x, H - GROUND_H + 4);
    ctx.lineTo(x, H - 4);
    ctx.stroke();
  }
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(0, H - GROUND_H, W, 4);
}

function drawKnife(k) {
  ctx.save();
  ctx.translate(k.x, k.y);
  ctx.rotate(k.rot);
  ctx.fillStyle = '#e6e6e6';
  ctx.beginPath();
  ctx.moveTo(-4, -18);
  ctx.lineTo(4, -18);
  ctx.lineTo(6, 5);
  ctx.lineTo(-6, 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#9a9a9a';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#5a3a22';
  ctx.fillRect(-5, 5, 10, 14);
  ctx.fillStyle = '#3a2414';
  ctx.fillRect(-5, 5, 10, 3);
  ctx.restore();
}

function drawFruits() {
  ctx.font = '30px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const f of fruits) ctx.fillText(f.emoji, f.x, f.y);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFlyingHud() {
  ctx.fillStyle = 'white';
  ctx.strokeStyle = 'black';
  ctx.lineWidth = 3;
  ctx.font = 'bold 32px Arial';
  ctx.textAlign = 'center';
  ctx.strokeText(sliceCount, W / 2, 50);
  ctx.fillText(sliceCount, W / 2, 50);

  ctx.font = 'bold 13px Arial';
  ctx.lineWidth = 2;
  ctx.textAlign = 'right';
  const bestText = 'Best: ' + best;
  ctx.strokeText(bestText, W - 12, 22);
  ctx.fillText(bestText, W - 12, 22);
}

function drawTower(highlightSelected) {
  ctx.textAlign = 'center';
  ctx.fillStyle = 'white';
  ctx.font = 'bold 15px Arial';
  ctx.fillText('Sliced: ' + sliceCount, W / 2, 32);
  ctx.font = 'bold 13px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(state === 'tower' ? 'Tap to lock the multiplier!' : '', W / 2, 52);

  for (let i = 0; i < towerBlocks.length; i++) {
    const b = towerBlocks[i];
    const by = TOWER_TOP + i * blockH;
    const isTarget = highlightSelected && i === selectedIndex;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = (state === 'locking' && !isTarget) ? 0.35 : 1;
    ctx.fillRect(TOWER_X, by + 1, TOWER_W, blockH - 2);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = isTarget ? '#ffffff' : 'rgba(255,255,255,0.35)';
    ctx.lineWidth = isTarget ? 3 : 1.5;
    ctx.strokeRect(TOWER_X, by + 1, TOWER_W, blockH - 2);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, TOWER_X + TOWER_W / 2, by + blockH / 2);
  }

  if (state === 'tower') {
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.moveTo(TOWER_X - 10, towerPointerY);
    ctx.lineTo(TOWER_X - 22, towerPointerY - 7);
    ctx.lineTo(TOWER_X - 22, towerPointerY + 7);
    ctx.closePath();
    ctx.fill();
  }

  ctx.textBaseline = 'alphabetic';
}

function loop() {
  update();
  drawBackground();

  if (state === 'flying') {
    drawFruits();
    drawParticles();
    drawKnife(knife);
    drawGround();
    drawFlyingHud();
  } else if (state === 'tower') {
    drawTower(false);
    drawKnife(knife);
  } else if (state === 'locking') {
    drawTower(true);
    drawParticles();
    drawKnife(knife);
  } else if (state === 'over') {
    drawTower(true);
    drawOver();
  }

  requestAnimationFrame(loop);
}

reset();
loop();
</script>
