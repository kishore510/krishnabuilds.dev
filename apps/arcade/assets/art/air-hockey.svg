<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06141f"/>
      <stop offset="0.5" stop-color="#0d3450"/>
      <stop offset="1" stop-color="#1c7ea0"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12435f"/>
      <stop offset="1" stop-color="#0d3450"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7fe0f2"/>
      <stop offset="1" stop-color="#2aa9c9"/>
    </radialGradient>
    <radialGradient id="red" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff9a8f"/>
      <stop offset="1" stop-color="#e05a4e"/>
    </radialGradient>
    <pattern id="holes" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.7" fill="#eef2f5" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <!-- rink -->
