<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e1414"/>
      <stop offset="0.5" stop-color="#9c2a16"/>
      <stop offset="1" stop-color="#f77f00"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff3d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#d9c7a6"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#ffd166" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#dots)"/>
  <ellipse cx="118" cy="58" rx="48" ry="30" fill="url(#glow)"/>
  <!-- motion arc: the knife's swing from top left down through the fruit -->
  <path d="M26 30 Q96 26 160 56 Q100 44 26 30Z" fill="url(#arc)"/>
  <path d="M40 40 Q100 40 154 62 Q100 50 40 40Z" fill="url(#arc)" fill-opacity="0.45"/>
  <!-- fruit, split along the swing -->
  <g transform="rotate(20 116 62)">
    <g transform="translate(-2 -6)">
      <path d="M98 60 A18 18 0 0 1 134 60Z" fill="#4f9d2a"/>
      <path d="M101 60 A15 15 0 0 1 131 60Z" fill="#fff3d6"/>
      <path d="M105 60 A11 11 0 0 1 127 60Z" fill="#a8dd6c"/>
      <circle cx="111" cy="56" r="1.3" fill="#2d5c17"/><circle cx="116" cy="53" r="1.3" fill="#2d5c17"/><circle cx="121" cy="56" r="1.3" fill="#2d5c17"/>
    </g>
    <g transform="translate(4 6)">
      <path d="M98 62 A18 18 0 0 0 134 62Z" fill="#4f9d2a"/>
      <path d="M101 62 A15 15 0 0 0 131 62Z" fill="#fff3d6"/>
      <path d="M105 62 A11 11 0 0 0 127 62Z" fill="#a8dd6c"/>
      <circle cx="111" cy="66" r="1.3" fill="#2d5c17"/><circle cx="116" cy="69" r="1.3" fill="#2d5c17"/><circle cx="121" cy="66" r="1.3" fill="#2d5c17"/>
    </g>
  </g>
  <path d="M92 52 L142 70" stroke="#fff3d6" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- juice -->
  <circle cx="142" cy="44" r="2.4" fill="#a8dd6c"/>
  <circle cx="98" cy="76" r="2" fill="#a8dd6c"/>
  <circle cx="137" cy="80" r="1.6" fill="#a8dd6c"/>
  <circle cx="92" cy="47" r="1.5" fill="#a8dd6c"/>
  <!-- knife, mid-swing past the fruit -->
  <g transform="rotate(24 160 52)">
    <path d="M128 49 L168 47 L168 57 L134 56 Q126 54 128 49Z" fill="url(#blade)" stroke="#5e1414" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M131 51 L166 49.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="167" y="45" width="4.5" height="14" rx="1.5" fill="#f77f00"/>
    <rect x="171" y="47.5" width="22" height="9" rx="4" fill="#1a0f08"/>
    <circle cx="177" cy="52" r="1.3" fill="#f77f00"/><circle cx="186" cy="52" r="1.3" fill="#f77f00"/>
  </g>
</svg>
