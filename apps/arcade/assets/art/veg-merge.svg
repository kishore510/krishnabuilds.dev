<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1e12"/>
      <stop offset="0.55" stop-color="#5a3a1c"/>
      <stop offset="1" stop-color="#e8891a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="soil" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.8" fill="#eaf5d8" fill-opacity="0.08"/><circle cx="6.5" cy="7" r="0.6" fill="#000" fill-opacity="0.15"/>
    </pattern>
    <g id="leaf"><path d="M0 0 Q-4 -5 -1.5 -7 Q0 -4 0 0 Q0 -4 1.5 -7 Q4 -5 0 0Z" fill="#7cb342"/></g>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#soil)"/>
  <!-- the board: 5 x 2 slots -->
  <rect x="63" y="31" width="114" height="54" rx="6" fill="#1e140a" fill-opacity="0.6"/>
  <g fill="#2b1e12" stroke="#5a3a1c" stroke-width="0.8">
    <rect x="67" y="35" width="19" height="21" rx="3"/><rect x="89" y="35" width="19" height="21" rx="3"/><rect x="111" y="35" width="19" height="21" rx="3"/><rect x="133" y="35" width="19" height="21" rx="3"/><rect x="155" y="35" width="19" height="21" rx="3"/>
    <rect x="67" y="60" width="19" height="21" rx="3"/><rect x="89" y="60" width="19" height="21" rx="3"/><rect x="111" y="60" width="19" height="21" rx="3"/><rect x="133" y="60" width="19" height="21" rx="3"/><rect x="155" y="60" width="19" height="21" rx="3"/>
  </g>
  <!-- seed, sprout, radish on the top row -->
  <circle cx="76.5" cy="47" r="6" fill="#8a6d3b"/><use href="#leaf" x="76.5" y="41.5"/>
  <circle cx="98.5" cy="47" r="6" fill="#7cb342" stroke="#4d7a24"/><use href="#leaf" x="98.5" y="41.5"/>
  <circle cx="164.5" cy="47" r="6" fill="#e0607a"/><use href="#leaf" x="164.5" y="41.5"/>
  <!-- two carrots sliding together into a pumpkin -->
  <circle cx="78.5" cy="72" r="6" fill="#ff8f3c" opacity="0.45"/>
  <path d="M84 69 H92 M84 75 H90" stroke="#ffd54a" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="100" cy="72" r="6.5" fill="#ff8f3c" stroke="#d96c1f"/><use href="#leaf" x="100" y="66"/>
  <path d="M108 72 H116" stroke="#ffd54a" stroke-width="2" stroke-linecap="round"/>
  <path d="M114 69 L117.5 72 L114 75" fill="none" stroke="#ffd54a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="142.5" cy="70" r="18" fill="url(#glow)"/>
  <ellipse cx="142.5" cy="72" rx="8" ry="6.5" fill="#e8891a" stroke="#b4650e"/>
  <path d="M142.5 65.5 V78.5 M138 66.5 Q135.5 72 138 77.5 M147 66.5 Q149.5 72 147 77.5" fill="none" stroke="#b4650e" stroke-width="1"/>
  <rect x="141.5" y="62.5" width="2" height="3.5" rx="0.8" fill="#4d7a24"/>
  <g fill="#ffd54a"><circle cx="133" cy="62" r="1.3"/><circle cx="153" cy="63" r="1.1"/><circle cx="151" cy="80" r="1"/></g>
</svg>
