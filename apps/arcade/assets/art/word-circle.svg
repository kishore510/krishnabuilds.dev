<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b968"/>
      <stop offset="0.5" stop-color="#e8a24a"/>
      <stop offset="1" stop-color="#c97c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbf4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fffbf4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2b1f3d" fill-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#dots)"/>
  <circle cx="120" cy="55" r="44" fill="url(#glow)"/>
  <circle cx="120" cy="55" r="40" fill="none" stroke="#2b1f3d" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="2 4"/>
  <circle cx="120" cy="57" r="33" fill="#2b1f3d" fill-opacity="0.25"/>
  <circle cx="120" cy="55" r="33" fill="#2b1f3d"/>
  <circle cx="120" cy="55" r="24" fill="none" stroke="#f4ede2" stroke-opacity="0.1" stroke-width="14"/>
  <!-- swipe through S, T, A, R -->
  <path d="M120 31 L140.8 43 L140.8 67 L120 79" fill="none" stroke="#7fcb99" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="10.5" text-anchor="middle">
    <g fill="#128266" stroke="#f4ede2" stroke-width="1.5">
      <circle cx="120" cy="31" r="7.5"/><circle cx="140.8" cy="43" r="7.5"/><circle cx="140.8" cy="67" r="7.5"/><circle cx="120" cy="79" r="7.5"/>
    </g>
    <g fill="#f4ede2">
      <circle cx="99.2" cy="67" r="7.5"/><circle cx="99.2" cy="43" r="7.5"/>
    </g>
    <g fill="#fffbf4">
      <text x="120" y="34.8">S</text><text x="140.8" y="46.8">T</text><text x="140.8" y="70.8">A</text><text x="120" y="82.8">R</text>
    </g>
    <g fill="#2b1f3d">
      <text x="99.2" y="70.8">E</text><text x="99.2" y="46.8">L</text>
    </g>
  </g>
  <!-- empty answer slots either side of the wheel -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#2b1f3d" fill-opacity="0.22">
    <rect x="2" y="47" width="13" height="13" rx="2.5"/><rect x="17" y="47" width="13" height="13" rx="2.5"/><rect x="32" y="47" width="13" height="13" rx="2.5"/><rect x="195" y="47" width="13" height="13" rx="2.5"/><rect x="210" y="47" width="13" height="13" rx="2.5"/><rect x="225" y="47" width="13" height="13" rx="2.5"/>
  </g>
</svg>
