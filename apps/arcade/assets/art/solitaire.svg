<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a1f"/>
      <stop offset="0.55" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#1a5c43"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8b872" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#d8b872" stop-opacity="0"/>
    </radialGradient>
    <pattern id="felt" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L6 0" stroke="#efeae0" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="back" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 0 L5 5 M5 0 L0 5" stroke="#5a5ea8" stroke-width="0.6"/>
    </pattern>
    <path id="heart" d="M0 3 C-4 0 -4 -3 -2 -3.5 C-1 -3.7 0 -3 0 -2 C0 -3 1 -3.7 2 -3.5 C4 -3 4 0 0 3Z"/>
    <path id="spade" d="M0 -3.5 C-4 0 -4 2.5 -2 2.6 C-1 2.7 -0.4 2 -0.4 1.6 L-1 3.5 H1 L0.4 1.6 C0.4 2 1 2.7 2 2.6 C4 2.5 4 0 0 -3.5Z"/>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#felt)"/>
  <ellipse cx="120" cy="58" rx="60" ry="32" fill="url(#glow)"/>
  <!-- empty foundation slots far left and right -->
  <g fill="none" stroke="#efeae0" stroke-opacity="0.2" stroke-dasharray="2 2">
    <rect x="18" y="34" width="26" height="36" rx="3"/><rect x="196" y="34" width="26" height="36" rx="3"/>
  </g>
  <!-- face-down pile -->
  <g>
    <rect x="66" y="40" width="26" height="36" rx="3" fill="#1d1f48"/>
    <rect x="64" y="37" width="26" height="36" rx="3" fill="#2c2f63" stroke="#05060d" stroke-opacity="0.4"/>
    <rect x="64" y="37" width="26" height="36" rx="3" fill="url(#back)"/>
    <rect x="66.5" y="39.5" width="21" height="31" rx="2" fill="none" stroke="#d8b872" stroke-width="0.9"/>
  </g>
  <!-- a cascade: K spade, Q heart, J spade -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="800" font-size="8">
    <g transform="translate(100 25)">
      <rect width="26" height="36" rx="3" fill="#efeae0" stroke="#22201b" stroke-opacity="0.35"/>
      <text x="3" y="9" fill="#22201b">K</text><use href="#spade" x="21.5" y="6.5" fill="#22201b"/>
    </g>
    <g transform="translate(100 35)">
      <rect width="26" height="36" rx="3" fill="#efeae0" stroke="#22201b" stroke-opacity="0.35"/>
      <text x="3" y="9" fill="#c1443c">Q</text><use href="#heart" x="21.5" y="6" fill="#c1443c"/>
    </g>
    <g transform="translate(100 45)">
      <rect width="26" height="36" rx="3" fill="#efeae0" stroke="#22201b" stroke-opacity="0.35"/>
      <text x="3" y="9" fill="#22201b">J</text><use href="#spade" x="21.5" y="6.5" fill="#22201b"/>
      <use href="#spade" fill="#22201b" transform="translate(13 22) scale(2)"/>
    </g>
    <!-- the ten of hearts being dragged onto it -->
    <rect x="140" y="47" width="26" height="36" rx="3" fill="#000" fill-opacity="0.3"/>
    <g transform="translate(137 41) rotate(8 13 18)">
      <rect width="26" height="36" rx="3" fill="#efeae0" stroke="#d8b872" stroke-width="1.4"/>
      <text x="3" y="9" fill="#c1443c">10</text><use href="#heart" x="21.5" y="6" fill="#c1443c"/>
      <use href="#heart" fill="#c1443c" transform="translate(13 21) scale(2)"/>
    </g>
  </g>
</svg>
