<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a08"/>
      <stop offset="0.55" stop-color="#1c140f"/>
      <stop offset="1" stop-color="#8a3a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff6b35" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <g id="pillar"><rect width="15" height="15" rx="1.5" fill="#8a7a68"/><rect width="15" height="4" rx="1.5" fill="#a89a88"/><rect y="12" width="15" height="3" fill="#5a4e42"/></g>
    <g id="box"><rect width="15" height="15" rx="1.5" fill="#c98a4b"/><path d="M0 5 H15 M0 10 H15" stroke="#8a5a2a" stroke-width="1"/><rect width="15" height="15" rx="1.5" fill="none" stroke="#8a5a2a"/></g>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <!-- arena floor: 9 x 4 tiles of 16 from (48,26) -->
  <rect x="48" y="26" width="144" height="64" fill="#120d09"/>
  <g fill="#1a1a1a"><rect x="64" y="26" width="16" height="64"/><rect x="96" y="26" width="16" height="64"/><rect x="128" y="26" width="16" height="64"/><rect x="160" y="26" width="16" height="64"/></g>
  <g>
    <use href="#pillar" x="64.5" y="42.5"/><use href="#pillar" x="96.5" y="42.5"/><use href="#pillar" x="128.5" y="42.5"/><use href="#pillar" x="160.5" y="42.5"/>
    <use href="#pillar" x="64.5" y="74.5"/><use href="#pillar" x="128.5" y="74.5"/><use href="#pillar" x="160.5" y="74.5"/>
    <use href="#box" x="48.5" y="26.5"/><use href="#box" x="80.5" y="26.5"/><use href="#box" x="144.5" y="58.5"/><use href="#box" x="176.5" y="42.5"/><use href="#box" x="48.5" y="58.5"/><use href="#box" x="80.5" y="74.5"/>
  </g>
  <!-- blast cross from the bomb that went off, cracking a box -->
  <g fill="#ff6b35" fill-opacity="0.85"><rect x="113" y="27" width="14" height="62" rx="5"/><rect x="81" y="59" width="78" height="14" rx="5"/></g>
  <g fill="#fbbf24"><rect x="116" y="30" width="8" height="56" rx="4"/><rect x="84" y="62" width="72" height="8" rx="4"/></g>
  <circle cx="120" cy="66" r="12" fill="#fff6d8" fill-opacity="0.75"/>
  <!-- the next bomb, fuse lit -->
  <circle cx="152" cy="34" r="14" fill="url(#glow)"/>
  <circle cx="150" cy="36" r="6.5" fill="#1a1a1a"/>
  <circle cx="148" cy="34" r="1.8" fill="#ffffff" fill-opacity="0.4"/>
  <path d="M153 30 Q155 26 158 27" fill="none" stroke="#f2e8d8" stroke-width="1.4" stroke-linecap="round"/>
  <g fill="#fbbf24"><circle cx="159" cy="26.5" r="2"/><path d="M159 21 V24 M164 26.5 H161 M162.5 22.5 L160.5 24.5" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/></g>
  <!-- a bot -->
  <g transform="translate(184 74)">
    <circle r="6" fill="#4a9eff"/>
    <circle cx="-2" cy="-1" r="1.9" fill="#ffffff"/><circle cx="2.4" cy="-1" r="1.9" fill="#ffffff"/>
    <circle cx="-1.6" cy="-0.8" r="0.9" fill="#120d09"/><circle cx="2.8" cy="-0.8" r="0.9" fill="#120d09"/>
  </g>
</svg>
