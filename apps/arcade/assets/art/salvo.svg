<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fa8d4"/>
      <stop offset="0.6" stop-color="#4db6e0"/>
      <stop offset="1" stop-color="#2a86ad"/>
    </linearGradient>
    <pattern id="sea" width="28" height="28" x="64" y="30" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#ffffff" fill-opacity="0.07"/><rect x="14" y="14" width="14" height="14" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <pattern id="grid" width="14" height="14" x="64" y="30" patternUnits="userSpaceOnUse">
      <path d="M.5 0V14M0 .5H14" stroke="#ffffff" stroke-opacity="0.3" fill="none"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb703" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#sea)"/>
  <rect width="240" height="92" fill="url(#grid)"/>
  <!-- ship: 3 cells, one hit -->
  <rect x="80.5" y="46.5" width="39" height="11" rx="4.5" fill="#1c4a5e"/>
  <rect x="80.5" y="46.5" width="39" height="4.6" rx="3.6" fill="#ffffff" fill-opacity="0.22"/>
  <circle cx="113" cy="52" r="4.6" fill="#ff5a4d"/>
  <path d="M110.8 49.8 L115.2 54.2 M115.2 49.8 L110.8 54.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- second ship, upright -->
  <rect x="150.5" y="60.5" width="11" height="25" rx="4.5" fill="#3a6b82"/>
  <rect x="150.5" y="60.5" width="4.6" height="25" rx="3.6" fill="#ffffff" fill-opacity="0.22"/>
  <!-- misses -->
  <g fill="#eaf6ff" stroke="#1c4a5e" stroke-opacity="0.35">
    <circle cx="71" cy="37" r="2"/><circle cx="99" cy="65" r="2"/><circle cx="141" cy="37" r="2"/><circle cx="169" cy="51" r="2"/><circle cx="85" cy="79" r="2"/>
  </g>
  <!-- the next shot: a reticle on the cell beside the hit -->
  <circle cx="127" cy="52" r="16" fill="url(#glow)"/>
  <rect x="120.5" y="45.5" width="13" height="13" rx="2.5" fill="#ffb703" fill-opacity="0.25" stroke="#ffb703" stroke-width="1.8"/>
  <path d="M127 41 V45 M127 59 V63 M116 52 H120 M134 52 H138" stroke="#ffb703" stroke-width="1.8" stroke-linecap="round"/>
  <!-- incoming splash -->
  <path d="M127 34 Q123 40 127 44 Q131 40 127 34Z" fill="#ffffff" fill-opacity="0.6"/>
</svg>
