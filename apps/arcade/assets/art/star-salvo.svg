<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050c"/>
      <stop offset="0.6" stop-color="#04121c"/>
      <stop offset="1" stop-color="#1a6f86"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e8f4"/>
      <stop offset="1" stop-color="#2aa9c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ed4ea" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5ed4ea" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stars" width="31" height="23" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="0.8" fill="#ffffff" fill-opacity="0.55"/><circle cx="20" cy="15" r="0.5" fill="#ffffff" fill-opacity="0.4"/><circle cx="27" cy="2" r="0.4" fill="#ffffff" fill-opacity="0.35"/>
    </pattern>
    <path id="diver" d="M0 -6 L6 3.6 L0 1.2 L-6 3.6Z"/>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#stars)"/>
  <!-- a wave of divers sweeping in -->
  <path d="M40 34 Q90 22 120 36 Q150 50 196 30" fill="none" stroke="#e63946" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4"/>
  <g fill="#e63946">
    <use href="#diver" transform="translate(92 32) rotate(180)"/><use href="#diver" transform="translate(108 36) rotate(180)"/>
    <use href="#diver" transform="translate(124 40) rotate(165)"/><use href="#diver" transform="translate(140 44) rotate(150)"/>
    <use href="#diver" transform="translate(156 40) rotate(180)"/>
  </g>
  <g fill="#8a1a24"><use href="#diver" transform="translate(124 40) rotate(165) scale(0.45)"/></g>
  <!-- a hit -->
  <g fill="#ffe28a"><circle cx="140" cy="44" r="5" fill-opacity="0.35"/><path d="M140 37 L141.2 42.8 L147 44 L141.2 45.2 L140 51 L138.8 45.2 L133 44 L138.8 42.8Z"/></g>
  <!-- bolts on the way up -->
  <g stroke="#ffe28a" stroke-width="2" stroke-linecap="round"><path d="M120 54 V60"/><path d="M120 66 V70"/></g>
  <!-- player ship -->
  <ellipse cx="120" cy="80" rx="22" ry="12" fill="url(#glow)"/>
  <path d="M120 70 L131 86 L120 81 L109 86Z" fill="url(#ship)"/>
  <path d="M120 72 L123 79 L117 79Z" fill="#ffffff" fill-opacity="0.75"/>
  <path d="M116 84 L120 91 L124 84" fill="#ffb703" fill-opacity="0.85"/>
</svg>
