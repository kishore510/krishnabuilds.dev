<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f1a"/>
      <stop offset="0.55" stop-color="#10152a"/>
      <stop offset="1" stop-color="#3a5aa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M.5 0V16M0 .5H16" stroke="#5a8ce8" stroke-opacity="0.08" fill="none"/>
    </pattern>
    <g id="br"><rect width="20" height="8" rx="1.6"/><rect x="1" y="1" width="18" height="2.4" rx="1" fill="#ffffff" fill-opacity="0.3"/></g>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#grid)"/>
  <!-- three rows of bricks, one just knocked out -->
  <g fill="#e05a4e"><use href="#br" x="4" y="28"/><use href="#br" x="26" y="28"/><use href="#br" x="48" y="28"/><use href="#br" x="70" y="28"/><use href="#br" x="92" y="28"/><use href="#br" x="114" y="28"/><use href="#br" x="136" y="28"/><use href="#br" x="158" y="28"/><use href="#br" x="180" y="28"/><use href="#br" x="202" y="28"/></g>
  <g fill="#ff9f4a"><use href="#br" x="4" y="38"/><use href="#br" x="26" y="38"/><use href="#br" x="48" y="38"/><use href="#br" x="70" y="38"/><use href="#br" x="92" y="38"/><use href="#br" x="136" y="38"/><use href="#br" x="158" y="38"/><use href="#br" x="180" y="38"/><use href="#br" x="202" y="38"/></g>
  <g fill="#ffd76a"><use href="#br" x="4" y="48"/><use href="#br" x="26" y="48"/><use href="#br" x="48" y="48"/><use href="#br" x="70" y="48"/><use href="#br" x="158" y="48"/><use href="#br" x="180" y="48"/><use href="#br" x="202" y="48"/></g>
  <!-- shards from the broken brick -->
  <g fill="#ff9f4a"><path d="M118 40 L123 38 L121 43Z"/><path d="M130 44 L134 41 L134 46Z"/><path d="M112 46 L115 43 L117 47Z"/></g>
  <!-- ball heading back down after the hit -->
  <path d="M120 48 L146 70 L150 66 Z" fill="url(#trail)"/>
  <circle cx="147" cy="68" r="9" fill="url(#glow)"/>
  <circle cx="147" cy="68" r="3.6" fill="#fff6d8"/>
  <!-- paddle -->
  <rect x="134" y="80" width="40" height="6" rx="3" fill="#4ac9d3"/>
  <rect x="136" y="80.5" width="36" height="2" rx="1" fill="#ffffff" fill-opacity="0.45"/>
</svg>
