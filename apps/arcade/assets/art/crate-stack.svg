<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a1f"/>
      <stop offset="0.55" stop-color="#4a5a3a"/>
      <stop offset="1" stop-color="#c9853a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <g id="crate">
      <rect width="34" height="13" rx="1.5" fill="#c9853a"/>
      <rect width="34" height="13" rx="1.5" fill="none" stroke="#a86f36" stroke-width="1.6"/>
