<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a1f"/>
      <stop offset="0.6" stop-color="#2b3a2a"/>
      <stop offset="1" stop-color="#5a2a2a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e34"/>
      <stop offset="1" stop-color="#3a3f47"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hedge" width="16" height="18" patternUnits="userSpaceOnUse">
      <ellipse cx="8" cy="9" rx="5" ry="7" fill="#3f7a3f" fill-opacity="0.35"/>
    </pattern>
    <g id="car">
      <rect x="-8" y="-13" width="16" height="26" rx="4.5"/>
      <rect x="-5.5" y="-8" width="11" height="6" rx="1.5" fill="#1a1d22" fill-opacity="0.75"/>
      <rect x="-5.5" y="5" width="11" height="3.5" rx="1.2" fill="#1a1d22" fill-opacity="0.55"/>
    </g>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#hedge)"/>
  <rect x="68" width="104" height="92" fill="url(#road)"/>
  <path d="M70.5 0V92M169.5 0V92" stroke="#ffb703" stroke-width="2.5"/>
  <path d="M103 -4V96M137 -4V96" stroke="#eef2f5" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="9 8"/>
  <!-- speed streaks -->
  <path d="M86 6V22M152 52V70M118 4V14M93 70V86" stroke="#eef2f5" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round"/>
  <!-- roadblock -->
  <g transform="translate(73 30)">
    <rect width="28" height="8" rx="1.5" fill="#ffb703"/>
    <path d="M4 0 L10 0 L6 8 L0 8Z M16 0 L22 0 L18 8 L12 8Z M27 0 L28 0 L28 2 L24 8Z" fill="#1a1d22"/>
  </g>
  <!-- traffic and player -->
  <use href="#car" x="154" y="50" fill="#ffb703"/>
  <ellipse cx="120" cy="72" rx="20" ry="18" fill="url(#glow)"/>
  <use href="#car" x="120" y="70" fill="#e63946"/>
  <path d="M114 84 L113 90 M126 84 L127 90" stroke="#ffb703" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
