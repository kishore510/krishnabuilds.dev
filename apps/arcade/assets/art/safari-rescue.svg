<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9853a"/>
      <stop offset="0.55" stop-color="#d99a4a"/>
      <stop offset="1" stop-color="#e8b96b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grit" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.8" fill="#8a6238" fill-opacity="0.2"/><circle cx="7" cy="8" r="0.6" fill="#f2f0ea" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#grit)"/>
  <!-- dirt track with two lane lines -->
  <rect x="66" y="0" width="80" height="92" fill="#8a6238" fill-opacity="0.35"/>
  <path d="M92.5 0V92M119.5 0V92" stroke="#f2f0ea" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="7 7"/>
  <!-- acacia -->
  <path d="M188 80 V52" stroke="#6b4a2b" stroke-width="3"/>
  <ellipse cx="188" cy="50" rx="22" ry="5" fill="#4a6b3a"/>
  <ellipse cx="34" cy="44" rx="18" ry="4.5" fill="#4a6b3a" fill-opacity="0.7"/><path d="M34 44 V70" stroke="#6b4a2b" stroke-opacity="0.7" stroke-width="2.4"/>
  <!-- rock in the left lane -->
  <path d="M72 40 Q74 32 82 32 Q90 32 90 40 Q90 45 81 45 Q72 45 72 40Z" fill="#7d7368"/>
  <path d="M75 37 Q78 34 83 34" fill="none" stroke="#bcb3a8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- stranded elephant calf waiting at the roadside -->
  <circle cx="162" cy="52" r="14" fill="url(#glow)"/>
  <g transform="translate(160 56)">
    <ellipse cx="2" cy="2" rx="9" ry="6.5" fill="#7d7368"/>
    <path d="M-4 6 V11 M0 7 V11 M5 7 V11 M9 5 V10" stroke="#6b6258" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="-7" cy="-3" r="5.5" fill="#7d7368"/>
    <ellipse cx="-4" cy="-3" rx="3.6" ry="4.6" fill="#6b6258"/>
    <path d="M-11 -1 Q-14 5 -11 9" fill="none" stroke="#7d7368" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="-8.5" cy="-4.5" r="0.9" fill="#2a2a2a"/>
  </g>
  <g transform="translate(150 38)">
    <path d="M-7 -6 H7 Q9 -6 9 -4 V4 Q9 6 7 6 H2 L-1 10 L-1 6 H-7 Q-9 6 -9 4 V-4 Q-9 -6 -7 -6Z" fill="#f2f0ea"/>
    <rect x="-1" y="-3.5" width="2" height="5" rx="1" fill="#c9853a"/><circle cy="3.4" r="1.1" fill="#c9853a"/>
  </g>
  <!-- jeep driving up the middle lane, dust behind -->
  <g fill="#f2f0ea" fill-opacity="0.35"><circle cx="100" cy="86" r="4"/><circle cx="112" cy="88" r="3"/><circle cx="106" cy="91" r="3.6"/></g>
  <g transform="translate(106 64)">
    <rect x="-12" y="-14" width="4" height="7" rx="1.5" fill="#2a2a2a"/><rect x="8" y="-14" width="4" height="7" rx="1.5" fill="#2a2a2a"/>
    <rect x="-12" y="6" width="4" height="7" rx="1.5" fill="#2a2a2a"/><rect x="8" y="6" width="4" height="7" rx="1.5" fill="#2a2a2a"/>
    <rect x="-9" y="-17" width="18" height="33" rx="4" fill="#4a6b3a"/>
    <rect x="-7" y="-11" width="14" height="6" rx="1.5" fill="#bcd9e8"/>
    <rect x="-7" y="-2" width="14" height="12" rx="2" fill="#3a5a2c"/>
    <rect x="-6" y="-17" width="4" height="2" rx="1" fill="#ffd76a"/><rect x="2" y="-17" width="4" height="2" rx="1" fill="#ffd76a"/>
  </g>
</svg>
