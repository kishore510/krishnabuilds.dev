  </g>
  <!-- coral heads -->
  <circle cx="104" cy="68" r="7" fill="#ff7a4a"/>
  <circle cx="112" cy="64" r="5" fill="#ff5f9a"/>
  <circle cx="126" cy="66" r="7.5" fill="#c9a24a"/>
  <path d="M121 64 q5 -3 10 0 M121 68 q5 -3 10 0" stroke="#8f6f2a" stroke-width="1.2" fill="none"/>
  <circle cx="137" cy="68" r="5" fill="#8a5cd6"/>
  <circle cx="96" cy="72" r="4" fill="#3fb8d8"/>
  <!-- blue tang -->
  <g transform="translate(92 38)">
    <path d="M0 0 C6 -9 20 -9 26 0 C20 9 6 9 0 0Z" fill="#2552ff"/>
    <path d="M26 0 L34 -6 L32 0 L34 6Z" fill="#ffd400"/>
