<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fc3d4"/>
      <stop offset="0.55" stop-color="#1495b0"/>
      <stop offset="1" stop-color="#0a6e8a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9fdff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e9fdff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dfc6"/>
      <stop offset="1" stop-color="#cdbf9f"/>
