<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 92" width="240" height="92">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5f28"/>
      <stop offset="0.55" stop-color="#4a8438"/>
      <stop offset="1" stop-color="#5b9a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb703" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grass" width="12" height="10" patternUnits="userSpaceOnUse">
      <path d="M3 8 L4 4 M6 8 L7.5 4.5" stroke="#fff2b0" stroke-opacity="0.1" stroke-width="1" stroke-linecap="round"/>
    </pattern>
    <clipPath id="hole"><path d="M100 0 H140 V74 A20 7 0 0 1 100 74Z"/></clipPath>
  </defs>
  <rect width="240" height="92" fill="url(#bg)"/>
  <rect width="240" height="92" fill="url(#grass)"/>
  <!-- three holes -->
  <ellipse cx="54" cy="76" rx="20" ry="7" fill="#241408"/><ellipse cx="54" cy="75" rx="20" ry="6" fill="#4a2e15"/>
  <ellipse cx="186" cy="76" rx="20" ry="7" fill="#241408"/><ellipse cx="186" cy="75" rx="20" ry="6" fill="#4a2e15"/>
  <ellipse cx="120" cy="74" rx="20" ry="7" fill="#241408"/>
  <!-- mole popping up in the middle -->
  <g clip-path="url(#hole)">
    <path d="M104 80 V58 Q104 42 120 42 Q136 42 136 58 V80Z" fill="#a9793f"/>
    <ellipse cx="120" cy="62" rx="10" ry="9" fill="#fff6d8" fill-opacity="0.85"/>
    <circle cx="114" cy="54" r="2" fill="#1c140d"/><circle cx="126" cy="54" r="2" fill="#1c140d"/>
    <ellipse cx="120" cy="59" rx="3.4" ry="2.6" fill="#e0a488"/>
    <path d="M117 64 Q120 66.5 123 64" fill="none" stroke="#6b4423" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M116 66 V69 M120 66.5 V69.5 M124 66 V69" stroke="#ffffff" stroke-width="1.4"/>
  </g>
  <path d="M100 74 A20 7 0 0 0 140 74" fill="none" stroke="#6b4423" stroke-width="2"/>
  <!-- the mallet coming down and the bonk -->
  <circle cx="132" cy="40" r="16" fill="url(#glow)"/>
  <g transform="rotate(-32 150 40)">
    <rect x="148" y="32" width="5" height="34" rx="2" fill="#6b4423"/>
    <rect x="136" y="22" width="30" height="13" rx="4" fill="#ffb703"/>
    <rect x="136" y="22" width="30" height="4.5" rx="2.2" fill="#fff2b0" fill-opacity="0.6"/>
  </g>
  <g fill="#fff2b0"><path d="M102 38 L104 33 L106 38 L111 40 L106 42 L104 47 L102 42 L97 40Z"/><circle cx="110" cy="31" r="1.5"/></g>
</svg>
