<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // Must stay in sync with packages/ui/src/theme.ts: cookie name `kb-theme`,
      // stored values "light" and "dark" ("system" is never stored).
      var kbTheme = document.cookie.match(/(?:^|; )kb-theme=(light|dark)(?:;|$)/);
      if (kbTheme) document.documentElement.setAttribute("data-theme", kbTheme[1]);
    </script>
    <title>krishnabuilds: small web apps, games and experiments</title>
    <meta
      name="description"
      content="A small collection of web apps I'm building: tools, games and experiments. Pick one and have a play."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="krishnabuilds" />
    <meta property="og:title" content="krishnabuilds: small web apps, games and experiments" />
    <meta property="og:description" content="A small collection of web apps I'm building: tools, games and experiments. Pick one and have a play." />
    <meta property="og:url" content="https://krishnabuilds.dev/" />
    <meta property="og:image" content="https://krishnabuilds.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="krishnabuilds: Small web apps, built in the open." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
