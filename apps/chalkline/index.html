    <title>Chalkline · krishnabuilds</title>
    <script>
      // Apply the theme before first paint to avoid a flash. The shared kb-theme cookie (see
      // packages/ui/src/theme.ts) wins; until src/settings/load.ts has moved an old local theme
      // into it, that local value applies (mirrors storedPreference in src/lib/theme.ts).
      ;(function () {
        var pref = 'system'
        var shared = document.cookie.match(/(?:^|; )kb-theme=(light|dark)(?:;|$)/)
        if (shared) pref = shared[1]
        else try {
          var settings = localStorage.getItem('chalkline.settings')
          if (settings === null) pref = localStorage.getItem('chalkline.theme') || 'system'
          else pref = ((JSON.parse(settings) || {}).appearance || {}).theme || 'system'
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
